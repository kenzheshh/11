name: Deploy wabase.ai

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: team_CJ35MFkPdgpTApAZ1jQdHc6H
          VERCEL_PROJECT_ID: prj_gkR5Wj0eddbzOAhQQuR8Rw8mUSoi
          VERCEL_TOKEN: ${{ secrets.WABASE_VERCEL_TOKEN }}
        run: npx --yes vercel@65.12.1 deploy --prod --yes --token "$VERCEL_TOKEN"
