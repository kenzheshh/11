[build]
  command = "npm run build"
  publish = "dist"

# Content-hashed assets (JS/CSS/fonts) are immutable — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Proxy the blog hosted by VibeSEO. These MUST come before the SPA catch-all
# below — Netlify applies the first matching redirect, so the /* rule would
# otherwise swallow /blog and /_vibeseo and serve index.html instead.
[[redirects]]
  from = "/blog/*"
  to = "https://blog-proxy.vibeseo.dev/blog/:splat"
  status = 200

[[redirects]]
  from = "/_vibeseo/*"
  to = "https://blog-proxy.vibeseo.dev/_vibeseo/:splat"
  status = 200

# SPA fallback — keep last so the proxies above take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
