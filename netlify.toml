[build]
  command = "npm run build"
  publish = "dist"

# Content-hashed assets (JS/CSS/fonts) are immutable — cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
