<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Страница не найдена · WABase</title>
  <meta name="robots" content="noindex">
  <style>
    :root{color-scheme:dark}
    *{margin:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#050505;color:#fff;text-align:center;padding:24px;
      font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .glow{position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:600px;height:600px;
      background:radial-gradient(circle,rgba(16,185,129,.18),transparent 60%);filter:blur(40px);pointer-events:none}
    .wrap{position:relative;max-width:520px}
    .logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:36px}
    .word{font-size:24px;font-weight:800;letter-spacing:-.02em}.word b{color:#34d399}
    .code{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1;
      background:linear-gradient(90deg,#34d399,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:24px;font-weight:700;margin:18px 0 8px}
    p{color:#94a3b8;margin-bottom:32px;font-weight:300}
    a{display:inline-block;background:#10b981;color:#fff;font-weight:700;
      padding:14px 28px;border-radius:999px;text-decoration:none;transition:background .2s}
    a:hover{background:#34d399}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#059669"/></linearGradient>
          <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#10B981"/></linearGradient>
        </defs>
        <path d="M20 60 L40 80" stroke="#047857" stroke-width="18" stroke-linecap="round"/>
        <path d="M40 80 L80 40" stroke="#059669" stroke-width="18" stroke-linecap="round"/>
        <path d="M50 60 L70 80" stroke="url(#g3)" stroke-width="18" stroke-linecap="round"/>
        <path d="M70 80 L110 40" stroke="url(#g4)" stroke-width="18" stroke-linecap="round"/>
      </svg>
      <span class="word">Wa<b>Base</b></span>
    </div>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Похоже, такой страницы нет или она была перемещена.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
